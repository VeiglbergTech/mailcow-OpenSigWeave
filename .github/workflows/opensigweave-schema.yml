name: OpenSigWeave MariaDB schema checks
# The integration job uses a disposable MariaDB 10.11 instance.

on:
  push:
    branches:
      - dev
      - beta
    paths:
      - "data/Dockerfiles/opensigweave/**"
      - "tests/python/**"
      - "tests/php/**"
      - "data/Dockerfiles/opensigweave/core/**"
      - "docker-compose.yml"
      - "generate_config.sh"
      - "update.sh"
      - "scripts/**"
      - "helper-scripts/backup_and_restore.sh"
      - "data/conf/rspamd/dynmaps/footer.php"
      - "data/conf/phpfpm/crons/identity-sync.php"
      - "data/web/inc/lib/mailcow/Identity/**"
      - ".github/workflows/opensigweave-schema.yml"
  pull_request:
    branches:
      - dev
      - beta
    paths:
      - "data/Dockerfiles/opensigweave/**"
      - "tests/python/**"
      - "tests/php/**"
      - "docker-compose.yml"
      - "generate_config.sh"
      - "update.sh"
      - "scripts/**"
      - "helper-scripts/backup_and_restore.sh"
      - "data/conf/rspamd/dynmaps/footer.php"
      - "data/conf/phpfpm/crons/identity-sync.php"
      - "data/web/inc/lib/mailcow/Identity/**"
      - ".github/workflows/opensigweave-schema.yml"

permissions:
  contents: read

jobs:
  schema:
    name: Compile and migrate schema on MariaDB 10.11
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-password
          MARIADB_DATABASE: mailcow
          MARIADB_USER: mailcow
          MARIADB_PASSWORD: mailcow-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DBNAME: mailcow
      DBUSER: mailcow
      DBPASS: mailcow-test-password
      OPENSIGWEAVE_DB_HOST: 127.0.0.1
      OPENSIGWEAVE_DB_PORT: 3306
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify pinned upstream source synchronization
        run: |
          bash scripts/sync-opensigweave-core.sh
          git diff --exit-code -- data/Dockerfiles/opensigweave/UPSTREAM_COMMIT data/Dockerfiles/opensigweave/core/modes.py data/Dockerfiles/opensigweave/core/rules.py data/Dockerfiles/opensigweave/core/variant_selector.py data/Dockerfiles/opensigweave/core/rule_repository.py data/Dockerfiles/opensigweave/signature_renderer.py data/Dockerfiles/opensigweave/signature_sanitizer.py data/Dockerfiles/opensigweave/signature_storage.py
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine database dependencies
        run: python -m pip install -r data/Dockerfiles/opensigweave/requirements.txt
      - name: Set up PHP for Mailcow identity tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, dom, xml, xmlwriter
      - name: Install Mailcow PHP test dependencies
        run: composer install --working-dir=tests/php --no-interaction --prefer-dist
      - name: Run Mailcow PHP unit tests
        run: tests/php/vendor/bin/phpunit --configuration tests/php/phpunit.xml.dist --testsuite mailcow
      - name: Compile embedded engine
        run: python -m compileall -q data/Dockerfiles/opensigweave tests/python
      - name: Build headless engine image
        run: docker build --tag opensigweave-engine-ci data/Dockerfiles/opensigweave
      - name: Check PHP footer adapter syntax
        run: docker run --rm --volume "$PWD:/src:ro" php:8.2-cli php -l /src/data/conf/rspamd/dynmaps/footer.php
      - name: Check modified shell scripts
        run: bash -n generate_config.sh update.sh helper-scripts/backup_and_restore.sh scripts/sync-opensigweave-core.sh
      - name: Validate Mailcow Compose configuration
        env:
          DBNAME: mailcow
          DBUSER: mailcow
          DBPASS: ci-db-password
          DBROOT: ci-db-root-password
          REDISPASS: ci-redis-password
          OPENSIGWEAVE_ENGINE_KEY: ci-opensigweave-engine-key-at-least-32-chars
          OPENSIGWEAVE_ENABLED: n
          MAILCOW_HOSTNAME: mail.example.test
          TZ: Etc/UTC
          COMPOSE_PROJECT_NAME: mailcow-dockerized
        run: docker compose --env-file /dev/null config > /tmp/mailcow-compose-config.yml
      - name: Run schema, MariaDB and HTTP boundary tests
        env:
          ENGINE_API_KEY: ci-engine-key-that-is-at-least-32-characters-long
        run: python -m unittest discover -s tests/python -v
