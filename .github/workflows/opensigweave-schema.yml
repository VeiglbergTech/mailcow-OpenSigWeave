name: OpenSigWeave MariaDB schema checks
# The integration job uses a disposable MariaDB 10.11 instance.

on:
  push:
    branches:
      - dev
    paths:
      - "data/Dockerfiles/opensigweave/**"
      - "tests/python/**"
      - "data/Dockerfiles/opensigweave/core/**"
      - "docker-compose.yml"
      - "generate_config.sh"
      - "update.sh"
      - "helper-scripts/backup_and_restore.sh"
      - "data/conf/rspamd/dynmaps/footer.php"
      - ".github/workflows/opensigweave-schema.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "data/Dockerfiles/opensigweave/**"
      - "tests/python/**"
      - ".github/workflows/opensigweave-schema.yml"

permissions:
  contents: read

jobs:
  schema:
    name: Compile and migrate schema on MariaDB 10.11
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root-test-password
          MARIADB_DATABASE: mailcow
          MARIADB_USER: mailcow
          MARIADB_PASSWORD: mailcow-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DBNAME: mailcow
      DBUSER: mailcow
      DBPASS: mailcow-test-password
      OPENSIGWEAVE_DB_HOST: 127.0.0.1
      OPENSIGWEAVE_DB_PORT: 3306
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine database dependencies
        run: python -m pip install -r data/Dockerfiles/opensigweave/requirements.txt
      - name: Compile embedded engine
        run: python -m compileall -q data/Dockerfiles/opensigweave tests/python
      - name: Build headless engine image
        run: docker build --tag opensigweave-engine-ci data/Dockerfiles/opensigweave
      - name: Check PHP footer adapter syntax
        run: docker run --rm --volume "$PWD:/src:ro" php:8.2-cli php -l /src/data/conf/rspamd/dynmaps/footer.php
      - name: Check modified shell scripts
        run: bash -n generate_config.sh update.sh helper-scripts/backup_and_restore.sh
      - name: Run schema, MariaDB and HTTP boundary tests
        env:
          ENGINE_API_KEY: ci-engine-key-that-is-at-least-32-characters-long
        run: python -m unittest discover -s tests/python -v
